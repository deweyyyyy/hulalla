<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งปัญหา/ข้อเสนอแนะ | Hulalla Party</title>
    
    <!-- Favicon & Icons -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png">

    <link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png">

    <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --sky: #2ec7e6;
            --ocean: #0f9ec7;
            --sand: #f4d06f;
            --sunset: #ff8e72;
            --leaf: #00c99f;
            --ink: #0b3c5d;
            --card: rgba(255, 255, 255, 0.92);
            --muted: #4b5563;
            --shadow: 0 18px 40px rgba(11, 60, 93, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background:
                radial-gradient(circle at 18% 20%, rgba(255,255,255,0.16), transparent 32%),
                radial-gradient(circle at 82% 12%, rgba(255,255,255,0.18), transparent 28%),
                linear-gradient(135deg, #2ec7e6 0%, #f4d06f 46%, #2fb9c3 100%);
            min-height: 100vh;
            padding: 22px;
            position: relative;
            overflow-x: hidden;
            color: var(--ink);
        }

        /* Tropical waves background */
        body::before {
            content: '';
            position: fixed;
            bottom: -40px;
            left: -10%;
            width: 120%;
            height: 320px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,60 Q220,100 520,60 T1200,60 L1200,120 L0,120 Z" fill="%230f9ec7" opacity="0.20"/></svg>');
            background-size: 650px 140px;
            animation: wave 18s linear infinite;
            z-index: 0;
            filter: drop-shadow(0 -10px 25px rgba(11, 60, 93, 0.12));
        }

        /* Soft palm shade */
        body::after {
            content: '';
            position: fixed;
            top: -120px;
            right: -120px;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(255, 142, 114, 0.25), transparent 60%);
            filter: blur(6px);
            z-index: 0;
        }

        @keyframes wave {
            0% { background-position-x: 0; }
            100% { background-position-x: 650px; }
        }

        /* Animated background */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.28;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(120px); opacity: 0; }
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 34px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-26px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 64px;
            color: var(--ink);
            margin-bottom: 10px;
            width: 92px;
            height: 92px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 26px;
            background: linear-gradient(145deg, rgba(255,255,255,0.65), rgba(255,255,255,0.35));
            box-shadow: 0 16px 40px rgba(11,60,93,0.18);
            animation: bob 2.4s ease-in-out infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            color: var(--ink);
            font-size: 2.35rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 6px 20px rgba(11,60,93,0.15);
            margin-bottom: 6px;
        }

        .subtitle {
            color: #0f3d56;
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #0f3d56;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 999px;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            margin-top: 12px;
            border: 1px solid rgba(11,60,93,0.08);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateX(-4px);
            box-shadow: 0 10px 24px rgba(11,60,93,0.14);
        }

        .report-card {
            background: var(--card);
            border-radius: 20px;
            padding: 34px;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.8s ease;
            border: 1px solid rgba(11,60,93,0.08);
            backdrop-filter: blur(6px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(26px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 22px; }

        label {
            display: block;
            color: #0f4b74;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .required { color: #d92b2b; }

        select, textarea, input[type="file"], input[type="search"] {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid rgba(11,60,93,0.12);
            border-radius: 14px;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: rgba(255,255,255,0.9);
            color: var(--ink);
        }

        select:focus, textarea:focus, input[type="search"]:focus {
            outline: none;
            border-color: var(--ocean);
            box-shadow: 0 0 0 3px rgba(46, 199, 230, 0.18);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .member-select-group { display: none; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .member-select-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 14px;
            flex-wrap: wrap;
        }

        .member-hint {
            color: var(--muted);
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .member-search {
            background: rgba(255,255,255,0.85);
            border: 1.5px solid rgba(11,60,93,0.12);
            border-radius: 12px;
            padding: 10px 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 260px;
            box-shadow: 0 6px 16px rgba(11,60,93,0.06);
        }

        .member-search i { color: var(--muted); font-size: 0.95rem; }

        .member-search input[type="search"] {
            border: none;
            padding: 0;
            height: 100%;
            background: transparent;
        }

        .member-search input[type="search"]:focus { box-shadow: none; }

        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 12px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .member-card {
            position: relative;
            background: rgba(255,255,255,0.92);
            border: 1.5px solid rgba(11,60,93,0.08);
            border-radius: 12px;
            padding: 12px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 10px 24px rgba(11,60,93,0.07);
        }

        .member-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(11,60,93,0.12);
        }

        .member-card.selected {
            border-color: var(--ocean);
            box-shadow: 0 16px 32px rgba(15,158,199,0.18);
            background: #e9f9ff;
        }

        .member-card .check {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid rgba(11,60,93,0.15);
            background: rgba(255,255,255,0.9);
            color: transparent;
            display: grid;
            place-items: center;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .member-card.selected .check {
            background: var(--ocean);
            color: #fff;
            border-color: var(--ocean);
            box-shadow: 0 0 0 4px rgba(15,158,199,0.12);
        }

        .member-avatar {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 8px;
            border: 3px solid rgba(15,158,199,0.22);
            background: linear-gradient(145deg, rgba(46,199,230,0.12), rgba(255,255,255,0.5));
        }

        .member-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .member-name { font-weight: 700; color: var(--ink); font-size: 0.98rem; }
        .member-meta { color: var(--muted); font-size: 0.86rem; margin-top: 2px; }

        .file-upload-area {
            border: 1.5px dashed rgba(11,60,93,0.18);
            border-radius: 14px;
            padding: 26px;
            text-align: center;
            transition: all 0.25s;
            cursor: pointer;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 10px 26px rgba(11,60,93,0.08);
        }

        .file-upload-area:hover {
            border-color: var(--ocean);
            background: #e9f9ff;
            box-shadow: 0 14px 30px rgba(15,158,199,0.15);
        }

        .file-upload-area i { font-size: 2.6rem; color: var(--ocean); margin-bottom: 8px; }

        .file-input { display: none; }

        .file-name { margin-top: 10px; color: #0f9c68; font-weight: 600; }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0f9ec7 0%, #00c99f 50%, #f4d06f 100%);
            color: #0b2c45;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Prompt', sans-serif;
            box-shadow: 0 16px 36px rgba(11,60,93,0.18);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 20px 42px rgba(11,60,93,0.22);
        }

        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.65; cursor: not-allowed; }

        .property-damage-options { display: none; margin-top: 10px; }

        .checkbox-group { display: flex; flex-direction: column; gap: 10px; }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.92);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(11,60,93,0.08);
        }

        .checkbox-item:hover { background: #f5fbff; }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: var(--ocean);
        }

        .checkbox-item label { margin: 0; cursor: pointer; font-weight: 600; color: #1f2f3c; }

        small { color: var(--muted); }

        @media (max-width: 768px) {
            h1 { font-size: 1.9rem; }
            .report-card { padding: 22px; }
            .member-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
            .member-select-head { align-items: flex-start; }
            .member-search { width: 100%; min-width: 0; }
        }
    </style>
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <header>
            <div class="logo"><i class="fas fa-umbrella-beach"></i></div>
            <h1>แจ้งปัญหา/ข้อเสนอแนะ</h1>
            <p class="subtitle">พรรคฮูลัลลา</p>
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> กลับหน้าหลัก
            </a>
        </header>

        <div class="report-card">
            <form id="reportForm">
                <!-- ประเภทการแจ้ง -->
                <div class="form-group">
                    <label for="reportType">
                        ประเภทการแจ้ง <span class="required">*</span>
                    </label>
                    <select id="reportType" required>
                        <option value="">-- เลือกประเภท --</option>
                        <option value="suggestion">ส่งข้อเสนอแนะต่อพรรค</option>
                        <option value="property_damage">แจ้งเรื่องพร็อพพรรค (เสียหาย/ชำรุด)</option>
                        <!--<option value="member_behavior">รายงานพฤติกรรมสมาชิกพรรค</option>-->
                    </select>
                </div>

                <!-- เลือกสมาชิก (แสดงเมื่อเลือกรายงานพฤติกรรม) -->
                <div class="form-group member-select-group" id="memberSelectGroup">
                    <div class="member-select-head">
                        <div>
                            <label>
                                เลือกสมาชิกที่ต้องการรายงาน <span class="required">*</span>
                            </label>
                            <p class="member-hint"><i class="fas fa-hand-pointer"></i> แตะเลือกรายชื่อได้หลายคน</p>
                        </div>
                        <div class="member-search">
                            <i class="fas fa-search"></i>
                            <input type="search" id="memberSearch" placeholder="ค้นหาชื่อเล่น/ชื่อจริง/ห้อง">
                        </div>
                    </div>
                    <div class="member-grid" id="memberGrid">
                        <!-- Members will be loaded here -->
                    </div>
                    <input type="hidden" id="selectedMembers">
                </div>

                <!-- ตัวเลือกพร็อพที่เสียหาย (แสดงเมื่อเลือกแจ้งพร็อพ) -->
                <div class="form-group property-damage-options" id="propertyDamageOptions">
                    <label>ลักษณะความเสียหาย</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="broken" value="ชำรุด/แตกหัก">
                            <label for="broken">ชำรุด/แตกหัก</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="damaged" value="เสียหาย">
                            <label for="damaged">เสียหาย</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="unstable" value="ตั้งไม่อยู่/โยกคลอน">
                            <label for="unstable">ตั้งไม่อยู่/โยกคลอน</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="missing" value="สูญหาย">
                            <label for="missing">สูญหาย</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="dirty" value="สกปรก/ต้องทำความสะอาด">
                            <label for="dirty">สกปรก/ต้องทำความสะอาด</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="malfunction" value="ใช้งานไม่ได้">
                            <label for="malfunction">ใช้งานไม่ได้</label>
                        </div>
                    </div>
                </div>

                <!-- รายละเอียด -->
                <div class="form-group">
                    <label for="details">
                        รายละเอียด <span class="required">*</span>
                    </label>
                    <textarea id="details" placeholder="กรุณาระบุรายละเอียดเพิ่มเติม..." required></textarea>
                </div>

                <!-- อัพโหลดรูปภาพ/วิดีโอ -->
                <div class="form-group">
                    <label>แนบรูปภาพหรือวิดีโอ (ถ้ามี)</label>
                    <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>คลิกเพื่ออัพโหลดไฟล์</p>
                        <small>รองรับ: JPG, PNG, MP4 (สูงสุด 10MB)</small>
                        <p class="file-name" id="fileName"></p>
                    </div>
                    <input type="file" id="fileInput" class="file-input" accept="image/*,video/*">
                </div>

                <!-- ปุ่มส่ง -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> ส่งรายงาน
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="/keys.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, set } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

        // Firebase configuration 
        const firebaseConfig = window.HLL_KEYS.firebase;

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const storage = getStorage(app);

        // Members data (pulling from /members)
        const memberGrid = document.getElementById('memberGrid');
        const memberSearchInput = document.getElementById('memberSearch');
        const memberHiddenInput = document.getElementById('selectedMembers');
        const allowedHosts = ['hulalla.party', 'www.hulalla.party', 'localhost', '127.0.0.1'];
        let members = [];
        let selectedMembers = new Set();

        function isAllowedHost() {
            const host = location.hostname.toLowerCase();
            // Allow hulalla.party and any subdomain (e.g. www.hulalla.party, api.hulalla.party)
            // and localhost / 127.0.0.1 for local dev
            return host === 'localhost' || host === '127.0.0.1' || host.endsWith('hulalla.party');
        }

        async function fetchMembersFromApi() {
            // Allow the page to run on any host but attempt to fetch the API.
            // If the host is not your production/dev host, a warning is shown but we still try the request.
            if (!isAllowedHost()) {
                await Swal.fire({
                    icon: 'warning',
                    title: 'ไม่อนุญาต (หรืออาจมีปัญหา CORS)',
                    text: `หน้าปัจจุบัน (${location.hostname}) ไม่อยู่ในรายการอนุญาตของสคริปต์ — จะพยายามเรียก API แต่หากเกิด CORS จะต้องเปิดใน Worker/Server`,
                    confirmButtonColor: '#0f9ec7'
                });
            }

            const endpoint = 'https://api.hulalla.party/api/members.json';

            // Use an AbortController to avoid hanging indefinitely
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000); // 8s timeout

            try {
                const res = await fetch(endpoint, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache',
                    credentials: 'omit',
                    signal: controller.signal
                });

                clearTimeout(timeout);

                // Browser will block access to the response body if CORS failed even if status is 200.
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status} ${res.statusText}`);
                }

                // If CORS is missing, the browser usually rejects the fetch with TypeError.
                const data = await res.json();
                return data;
            } catch (err) {
                clearTimeout(timeout);
                console.error('fetchMembersFromApi error:', err);

                // Show a clearer error and give a debugging hint
                const hint = `ถ้าเกิดข้อผิดพลาดชนิด CORS ให้ตรวจสอบ Worker/Server ว่าได้ส่ง \"Access-Control-Allow-Origin: ${location.origin}\" หรือ \"*\" (สำหรับการทดสอบ) หรืออนุญาต origin นี้แล้วหรือยัง`;

                Swal.fire({
                    icon: 'error',
                    title: 'โหลดข้อมูลสมาชิกไม่สำเร็จ',
                    html: `<div>error: ${err.message || err}</div><div style="margin-top:8px;font-size:0.95rem;color:#475569">${hint}</div>`,
                    confirmButtonColor: '#d92b2b'
                });

                return [];
            }
        }

        function buildMemberCard(member) {
            const imagePath = member.image || `/members/images/${member.id}.png`;
            const fallback = imagePath.replace('.png', '.jpg');
            return `
                <div class="member-card" data-nickname="${member.nickname}" data-id="${member.id}" data-class="${member.class}">
                    <span class="check"><i class="fas fa-check"></i></span>
                    <div class="member-avatar">
                        <img src="${imagePath}" alt="${member.nickname}" loading="lazy"
                             onerror="this.onerror=null;this.src='${fallback}';">
                    </div>
                    <div class="member-name">${member.nickname}</div>
                    <div class="member-meta">ม.${member.class}</div>
                </div>
            `;
        }

        function syncHiddenInput() {
            if (memberHiddenInput) {
                memberHiddenInput.value = Array.from(selectedMembers).join(',');
            }
        }

        function renderMemberGrid(list) {
            if (!memberGrid) return;
            memberGrid.innerHTML = list.map(buildMemberCard).join('');

            memberGrid.querySelectorAll('.member-card').forEach(card => {
                const nickname = card.dataset.nickname;
                if (selectedMembers.has(nickname)) {
                    card.classList.add('selected');
                }

                card.addEventListener('click', () => {
                    if (selectedMembers.has(nickname)) {
                        selectedMembers.delete(nickname);
                        card.classList.remove('selected');
                    } else {
                        selectedMembers.add(nickname);
                        card.classList.add('selected');
                    }
                    syncHiddenInput();
                });
            });
        }

        function filterMembers(term) {
            const keyword = term.trim().toLowerCase();
            if (!keyword) {
                renderMemberGrid(members);
                return;
            }

            const filtered = members.filter(member =>
                `${member.nickname} ${member.fullname} ${member.class}`.toLowerCase().includes(keyword)
            );

            renderMemberGrid(filtered);
        }

        async function loadMembers() {
            selectedMembers = new Set();
            syncHiddenInput();
            if (memberSearchInput) {
                memberSearchInput.value = '';
            }
            members = await fetchMembersFromApi();
            renderMemberGrid(members);
            if (memberSearchInput) {
                memberSearchInput.focus();
            }
        }

        if (memberSearchInput) {
            memberSearchInput.addEventListener('input', (e) => filterMembers(e.target.value));
        }

        // Create background particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Handle report type change
        const reportType = document.getElementById('reportType');
        const memberSelectGroup = document.getElementById('memberSelectGroup');
        const propertyDamageOptions = document.getElementById('propertyDamageOptions');

        reportType.addEventListener('change', function() {
            // Hide all conditional sections
            memberSelectGroup.style.display = 'none';
            propertyDamageOptions.style.display = 'none';
            selectedMembers = new Set();
            syncHiddenInput();
            if (memberGrid) { memberGrid.innerHTML = ''; }
            
            // Show relevant section based on selection
            if (this.value === 'member_behavior') {
                memberSelectGroup.style.display = 'block';
                loadMembers();
            } else if (this.value === 'property_damage') {
                propertyDamageOptions.style.display = 'block';
            }
        });

        // Handle file upload display
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const fileSizeMB = file.size / (1024 * 1024);
                
                if (fileSizeMB > 10) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ไฟล์ใหญ่เกินไป',
                        text: 'กรุณาเลือกไฟล์ที่มีขนาดไม่เกิน 10MB',
                        confirmButtonColor: '#667eea'
                    });
                    this.value = '';
                    fileName.textContent = '';
                    return;
                }
                
                fileName.textContent = `✓ ${file.name} (${fileSizeMB.toFixed(2)} MB)`;
            }
        });

        // Handle form submission
        const reportForm = document.getElementById('reportForm');
        const submitBtn = document.getElementById('submitBtn');

        reportForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const reportTypeValue = reportType.value;
            const details = document.getElementById('details').value;
            
            // Validate member selection if behavior report
            if (reportTypeValue === 'member_behavior') {
                const selectedMemberValue = document.getElementById('selectedMembers').value;
                if (!selectedMemberValue) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'กรุณาเลือกสมาชิก',
                        text: 'เลือกสมาชิกที่ต้องการรายงานอย่างน้อย 1 คน',
                        confirmButtonColor: '#667eea'
                    });
                    return;
                }
            }
            
            // Show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังส่งข้อมูล...';
            
            try {
                let fileURL = null;
                
                // Upload file if exists
                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const timestamp = Date.now();
                    const fileRef = storageRef(storage, `reports/${timestamp}_${file.name}`);
                    
                    await uploadBytes(fileRef, file);
                    fileURL = await getDownloadURL(fileRef);
                }
                
                // Prepare report data
                const reportData = {
                    type: reportTypeValue,
                    details: details,
                    fileURL: fileURL,
                    timestamp: Date.now(),
                    date: new Date().toLocaleString('th-TH')
                };
                
                // Add specific data based on type
                if (reportTypeValue === 'member_behavior') {
                    reportData.memberNames = document.getElementById('selectedMembers').value.split(',').filter(Boolean);
                } else if (reportTypeValue === 'property_damage') {
                    const damageTypes = [];
                    document.querySelectorAll('.property-damage-options input[type="checkbox"]:checked').forEach(checkbox => {
                        damageTypes.push(checkbox.value);
                    });
                    reportData.damageTypes = damageTypes;
                }
                
                // Save to Firebase Realtime Database
                const reportsRef = ref(database, 'reports');
                const newReportRef = push(reportsRef);
                await set(newReportRef, reportData);
                
                // Success message
                Swal.fire({
                    icon: 'success',
                    title: 'ส่งรายงานสำเร็จ!',
                    text: 'ขอบคุณสำหรับการแจ้งปัญหา ทางพรรคจะดำเนินการตรวจสอบโดยเร็วที่สุด',
                    confirmButtonColor: '#667eea'
                }).then(() => {
                    reportForm.reset();
                    fileName.textContent = '';
                    memberSelectGroup.style.display = 'none';
                    propertyDamageOptions.style.display = 'none';
                    selectedMembers = new Set();
                    syncHiddenInput();
                    if (memberGrid) { memberGrid.innerHTML = ''; }
                    if (memberSearchInput) { memberSearchInput.value = ''; }
                });
                
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถส่งรายงานได้ กรุณาลองใหม่อีกครั้ง',
                    confirmButtonColor: '#ef4444'
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> ส่งรายงาน';
            }
        });
    </script>
</body>
</html>
